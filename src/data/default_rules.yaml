rules:
- pattern: (?i)Zelle\s+Payment\s+From\s+([A-Za-z]+(?:\s+[A-Za-z]+){0,2})(?:\s+[A-Za-z0-9]{10,}|\s+\d{6,}|\s*$)
  merchant: Zelle Transfer
  category: Transfer
  subcategory: P2P Credit
  is_transfer: true
- pattern: (?i)Zelle\s+Payment\s+To\s+([A-Za-z]+(?:\s+[A-Za-z]+){0,2})(?:\s+[A-Za-z0-9]{10,}|\s+\d{6,}|\s*$)
  merchant: Zelle Transfer
  category: Transfer
  subcategory: P2P Debit
  is_transfer: true
- pattern: (?i)(?:AUTOMATIC\s+PAYMENT\s*-\s*THANK\s+YOU|CHASE\s+CREDIT\s+CRD\s+AUTOPAY|DISCOVER\s+E-?PAYMENT|CITI\s+AUTOPAY\s+PAYMENT|CAPITAL\s+ONE\s+AUTOPAY|AMEX\s+EPAYMENT)
  merchant: Credit Card Payment
  category: Transfer
  subcategory: Credit Card Payoff
  is_transfer: true
- pattern: (?i)(?:WEALTHFRONT|FIDELITY|VANGUARD|ROBINHOOD|SCHWAB|COINBASE)
  merchant: Investment Transfer
  category: Transfer
  subcategory: Investment
  is_transfer: true
- pattern: (?i)(?:BILT\s+PAYMENT|BILT\s*RENT)
  merchant: Bilt Rent
  category: Housing
  subcategory: Rent
- pattern: (?i)(?:PAYROLL|COMPUNNEL.*PAYROLL|DIRECT\s+DEP|ADP\s+PAYROLL|PAYCHEX)
  merchant: Payroll Deposit
  category: Income
  subcategory: Salary
